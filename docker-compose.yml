name: orbit-hrms

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in docker/.env.production}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in docker/.env.production}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/.env.production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in docker/.env.production}
    volumes:
      - mysql-data:/var/lib/mysql
      # The app uses database-per-tenant tenancy, so its DB account needs DDL
      # privileges to create and migrate tenant databases.
      - ./docker/mysql/init/01-grant-tenant-privileges.sh:/docker-entrypoint-initdb.d/01-grant-tenant-privileges.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        BACKEND_DIR: orbit-hrms-api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Orbit HRMS}
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Set APP_KEY in docker/.env.production}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?Set APP_URL in docker/.env.production}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in docker/.env.production}
      FRONTEND_URLS: ${FRONTEND_URLS:?Set FRONTEND_URLS in docker/.env.production}
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in docker/.env.production}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in docker/.env.production}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/.env.production}
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
      FILESYSTEM_DISK: local
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Orbit HRMS}
      PUSHER_APP_ID: ${PUSHER_APP_ID:-}
      PUSHER_APP_KEY: ${PUSHER_APP_KEY:-}
      PUSHER_APP_SECRET: ${PUSHER_APP_SECRET:-}
      PUSHER_HOST: ${PUSHER_HOST:-}
      PUSHER_PORT: ${PUSHER_PORT:-443}
      PUSHER_SCHEME: ${PUSHER_SCHEME:-https}
      PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_TENANT_MIGRATIONS: ${RUN_TENANT_MIGRATIONS:-true}
    volumes:
      - laravel-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - backend

  api-web:
    build:
      context: .
      dockerfile: docker/api-nginx.Dockerfile
      args:
        BACKEND_DIR: orbit-hrms-api
    restart: unless-stopped
    volumes:
      - laravel-storage:/var/www/html/storage:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        FRONTEND_DIR: .
        # Keep the SPA and API on one public origin. Nginx proxies this path to
        # Laravel, so no EC2 public API port or browser CORS workaround is needed.
        VITE_API_URL: /api
        VITE_TENANT: ${VITE_TENANT:?Set VITE_TENANT in docker/.env.production}
        VITE_PUSHER_APP_KEY: ${PUSHER_APP_KEY:-}
        VITE_PUSHER_HOST: ${PUSHER_HOST:-}
        VITE_PUSHER_PORT: ${PUSHER_PORT:-443}
        VITE_PUSHER_SCHEME: ${PUSHER_SCHEME:-https}
        VITE_PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER:-}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api-web:
        condition: service_started
    networks:
      - backend

volumes:
  mysql-data:
  laravel-storage:

networks:
  backend:
    driver: bridge
